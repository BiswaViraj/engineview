<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EngineView</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; background: #0b0f14; color: #e6edf3; }
      header { padding: 14px 20px; border-bottom: 1px solid #1c2530; font-weight: 600; }
      main { padding: 20px; display: grid; gap: 16px; max-width: 1100px; }
      textarea { width: 100%; min-height: 120px; background: #11161d; color: inherit;
        border: 1px solid #1c2530; border-radius: 8px; padding: 10px; font-family: ui-monospace, monospace; }
      button { background: #1f6feb; color: white; border: 0; border-radius: 8px;
        padding: 8px 14px; font: inherit; cursor: pointer; }
      button.ghost { background: transparent; border: 1px solid #1c2530; color: #e6edf3; }
      input { background: #11161d; color: inherit; border: 1px solid #1c2530;
        border-radius: 8px; padding: 8px 10px; font: inherit; }
      table { border-collapse: collapse; width: 100%; font-size: 13px; }
      th, td { border: 1px solid #1c2530; padding: 6px 10px; text-align: left; }
      th { background: #11161d; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .saved a { color: #58a6ff; cursor: pointer; text-decoration: none; }
      .muted { color: #8b949e; font-size: 13px; }
    </style>
  </head>
  <body>
    <header>EngineView</header>
    <main id="app"></main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
